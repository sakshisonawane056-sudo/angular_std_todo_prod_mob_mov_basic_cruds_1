
<div class="container mb-3">
    <div class="row">
    <div class="col-12">
        <h1>{{isInEditMode ? 'Update Todo' : 'Add Todo'}}</h1>
    </div>
    <div class="col-md-6">
        <div class="card p-2">
            <div class="card-body">
                <div class="mb-3">
                    <label for="todoItem">Todo Item</label>
                    <input type="text" class="form-control" #todoItemRef>
                </div>
                
                <button 
                (click)="onTodoAdd()"
                *ngIf = "!isInEditMode"
                mat-raised-button color="primary" class="w-100">Add Todo</button>
                <button
                (click)="onTodoUpdate()" 
                *ngIf = "isInEditMode" 
                mat-raised-button color="accent" class="w-100">Update Todo</button>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-2">
            <div class="card-body">
                <ul class="list-group" *ngIf="todosArr.length > 0; else noTodos">
                    <li class="list-group-item d-flex justify-content-between" *ngFor ="let todo of todosArr">
                        <strong>
                            {{todo.todoItem}}
                        </strong>
                        <div>
                            <button 
                            (click)="onTodoEdit(todo)"
                            mat-mini-fab color="primary" class="mr-2" aria-label="Example icon button with a menu icon">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button 
                            (click)="onTodoDelete(todo.todoId)"
                            mat-mini-fab color="warn" aria-label="Example icon button with a menu icon">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </div>
                    </li>
                </ul>

                <ng-template #noTodos class="mt-3">
                    <p class="alert alert-warning">
                        No todos found. Please add some todos.
                    </p>
                </ng-template>
            </div>
        </div>
        
    </div>
</div>
</div>
