
<div class="row justify-content-center">
  <div class="col-md-6 mb-5">
    <div class="card shadow-sm">
      
      <div class="card-header bg-primary text-white">
            <h1 class="font-weight-bold">{{isInEditMode ? 'Update Mobile' : 'Add Mobile'}}</h1>
      </div>

      <div class="card-body">
        <form #mobileForm="ngForm">
          <div class="form-group">
            <label>Mobile Name</label>
            <input
              #mobileNameRef
              type="text"
              class="form-control"
              placeholder="Enter mobile name">
          </div>

          <div class="form-group">
          <label>Image URL</label>
          <input
            #imgRef
            type="url"
            class="form-control"
            placeholder="Enter image URL"
            name="imageUrl"
            required>
        </div>

          <div class="form-group">
            <label>Brand</label>
            <input
              #brandRef
              type="text"
              class="form-control"
              placeholder="Enter brand">
          </div>

          <div class="form-group">
            <label>Price</label>
            <input
              #priceRef
              type="number"
              class="form-control"
              placeholder="Enter price">
          </div>

          <div class="form-group">
            <label>RAM</label>
            <select #ramRef class="form-control">
              <option value="">Select RAM</option>
              <option value="4GB">4GB</option>
              <option value="6GB">6GB</option>
              <option value="8GB">8GB</option>
              <option value="12GB">12GB</option>
              <option value="16GB">16GB</option>
            </select>
          </div>

          <div class="form-group">
            <label>Storage</label>
            <select #storageRef class="form-control">
              <option value="">Select Storage</option>
              <option value="64GB">64GB</option>
              <option value="128GB">128GB</option>
              <option value="256GB">256GB</option>
              <option value="512GB">512GB</option>
              <option value="1TB">1TB</option>
            </select>
          </div>
            <hr>
            <div class="d-flex justify-content-between">
              <button
              class="w-100"
                *ngIf="!isInEditMode"
                type="button"
                (click)="onMobileAdd()"
                mat-raised-button
                color="primary">
                Add Mobile
              </button>

              <button
              class="w-100"
                *ngIf="isInEditMode"
                type="button"
                (click)="onMobileUpdate()"
                mat-raised-button
                color="accent">
                Update Mobile
              </button>
            </div>
        </form>
      </div>

      

    </div>
  </div>
</div>
<div class="row">
      <div
        class="col-md-3 col-sm-6 mb-4"
        *ngFor="let mobile of mobiles; trackBy: trackByMobileId">

        <mat-card class="h-100">

          <mat-card-header>
            <mat-card-title>
              {{mobile.mobileName}}
            </mat-card-title>
            <mat-card-subtitle>
              {{mobile.brand}}
            </mat-card-subtitle>
          </mat-card-header>
          <img
        mat-card-image
        [src]="mobile.img"
        [alt]="mobile.mobileName"
        style="height: 180px; object-fit: contain;">

          <mat-card-content class="mt-3">

            <h5 class="text-primary font-weight-bold">
              ₹{{mobile.price}}
            </h5>

            <p><strong>RAM:</strong> {{mobile.ram}}</p>
            <p><strong>Storage:</strong> {{mobile.storage}}</p>

          </mat-card-content>

          <mat-card-actions class="d-flex justify-content-between">

            <button
              type="button"
              (click)="onMobileEdit(mobile)"
              mat-raised-button
              color="primary">
              Edit
            </button>

            <button
              type="button"
              (click)="onMobileDelete(mobile.mobileId)"
              mat-raised-button
              color="warn">
              Delete
            </button>

          </mat-card-actions>

        </mat-card>

      </div>

    </div>
