<div class="row">
    <div class="col-md-4">
        <div class="card mb-4">
            <div class="card-body">
                <h1 class="font-weight-bold">{{isInEditMode ? 'Update Student' : 'Add Student'}}</h1>

                    <div class="form-group">
                        <label for="fname">First Name*</label>
                        <input
                        #fnameRef
                        type="text"
                        class="form-control"
                        placeholder="Enter Fist Name">
                    </div>
                    <div class="form-group">
                        <label for="lname">Last Name*</label>
                        <input
                        #lnameRef
                        type="text"
                        class="form-control"
                        placeholder="Enter Last Name">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email*</label>
                        <input
                        #emailRef
                        type="email"
                        class="form-control"
                        placeholder="Enter Email">
                    </div>

                    <div class="form-group">
                        <label for="contact">Contact*</label>
                        <input
                        #contactRef
                        type="text"
                        class="form-control"
                        placeholder="Enter Contact Number">
                    </div>
        
                    <div class="form-group">
                        <label for="isActive">Is Active</label>
                        <select #isActiveRef class="form-control">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                        </select>
                    </div>

                    <button
                    (click)="onStdAdd()"
                    class="w-100" 
                    *ngIf="!isInEditMode"
                    mat-raised-button color="primary">
                        Add Student
                    </button>

                    <button
                    (click)="onStdUpdate()"
                    *ngIf="isInEditMode" 
                    mat-raised-button color="warn" class="ml-2 w-100">
                        Update Student
                    </button>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <div class="card">
            <div class="card-body table-responsive">
                <table class="table table-bordered mb-0" *ngIf ="studentsArr.length > 0; else noStd">
                    <thead class="thead-dark">
                        <tr>
                        <th>Sr No</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Contact</th>
                        <th>Is Active</th>
                        <th>Edit</th>
                        <th>Remove</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr *ngFor="let std of studentsArr; let i = index; trackBy : trackByStdId">
                        <td>{{i + 1}}</td>
                        <td>{{std.fname}} {{std.lname}}</td>
                        <td>{{std.email}}</td>
                        <td>{{std.contact}}</td>
                        <td class="text-center">
                            <span class="badge" [ngClass]="{
                                'badge-success': std.isActive === 'Yes',
                                'badge-danger': std.isActive === 'No'
                            }">
                                {{std.isActive}}</span>
                        </td>
                        <td class="text-center">
                            <button (click)="onStdEdit(std)" mat-mini-fab color="primary">
                            <mat-icon>edit</mat-icon>
                            </button>
                        </td>
                        <td class="text-center">
                            <button (click)="onStdDelete(std.stdId)" mat-mini-fab color="warn">
                            <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                        </tr>

                    </tbody>
                </table>

                <ng-template #noStd>
                    <p class="alert alert-warning">
                        no student added yet !!!
                    </p>
                </ng-template>
            </div>
        </div>
    </div>
</div>
