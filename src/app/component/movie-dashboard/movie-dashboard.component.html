
<div class="row">

  <!-- Movie Form -->
  <div class="col-md-4 mb-4">

    <mat-card>

      <mat-card-header>
        <mat-card-title>
          {{isInEditMode ? 'Update Movie' : 'Add Movie'}}
        </mat-card-title>
      </mat-card-header>

      <mat-card-content>

        <div class="form-group mt-3">
          <label>Movie Name *</label>
          <input
            #movieNameRef
            type="text"
            class="form-control"
            placeholder="Enter movie name">
        </div>

        <div class="form-group">
          <label>Director *</label>
          <input
            #directorRef
            type="text"
            class="form-control"
            placeholder="Enter director name">
        </div>

        <div class="form-group">
          <label>Genre *</label>
          <select
            #genreRef
            class="form-control">

            <option value="">Select Genre</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Thriller">Thriller</option>
            <option value="Romance">Romance</option>
            <option value="Horror">Horror</option>
            <option value="Adventure">Adventure</option>

          </select>
        </div>

        <div class="form-group">
          <label>Release Year *</label>
          <input
            #releaseYearRef
            type="number"
            class="form-control"
            placeholder="Enter release year">
        </div>

        <div class="form-group">
          <label>Rating *</label>
          <input
            #ratingRef
            type="number"
            class="form-control"
            placeholder="Enter rating"
            min="0"
            max="10"
            step="0.1">
        </div>

      </mat-card-content>

      <mat-card-actions>

        <button
          *ngIf="!isInEditMode"
          type="button"
          (click)="onMovieAdd()"
          mat-raised-button
          color="primary">
          Add Movie
        </button>

        <button
          *ngIf="isInEditMode"
          type="button"
          (click)="onMovieUpdate()"
          mat-raised-button
          color="accent">
          Update Movie
        </button>

      </mat-card-actions>

    </mat-card>

  </div>

  <!-- Movie List -->
  <div class="col-md-8">

    <div class="row">

      <div
        class="col-md-6 col-lg-4 mb-3"
        *ngFor="let movie of movies; trackBy: trackByMovieId">

        <mat-card class="h-100">

          <mat-card-header>
            <mat-card-title>
              {{movie.movieName}}
            </mat-card-title>

            <mat-card-subtitle>
              {{movie.director}}
            </mat-card-subtitle>
          </mat-card-header>

          <mat-card-content class="mt-3">

            <p>
              <strong>Genre:</strong> {{movie.genre}}
            </p>

            <p>
              <strong>Release Year:</strong>
              {{movie.releaseYear}}
            </p>

            <h5 class="text-primary font-weight-bold">
              Rating: {{movie.rating}} / 10
            </h5>

          </mat-card-content>

          <mat-card-actions
            class="d-flex justify-content-between">

            <button
              type="button"
              (click)="onMovieEdit(movie)"
              mat-raised-button
              color="primary">
              <i class="fa fa-edit mr-1"></i>
              Edit
            </button>

            <button
              type="button"
              (click)="onMovieDelete(movie.movieId)"
              mat-raised-button
              color="warn">
              <i class="fa fa-trash mr-1"></i>
              Delete
            </button>

          </mat-card-actions>

        </mat-card>

      </div>

    </div>

  </div>

</div>
